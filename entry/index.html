<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Ordely</title>
  <link rel="stylesheet" href="/src/shared/ui/styles/base.css" />
  <link rel="stylesheet" href="/src/shared/ui/styles/auth.css" />
</head>
<body class="auth-page auth-is-resolving">
  <main class="auth-shell layout-shell layout-full-height">
    <div class="auth-bg-visual"></div>

    <div class="layout-anchor">
      <div class="layout-anchor-stack">
        <img class="layout-anchor-icon" src="/src/shared/brand/assets/icon.png" alt="" width="512" height="512">
        <p class="layout-anchor-text" data-copy="sideEyebrow"></p>
        <div class="layout-anchor-divider"></div>
      </div>
    </div>

    <section class="auth-layout layout-2col" data-copy-aria-label="pageAria">
      <div class="auth-context-side layout-context layout-center layout-hide-mobile">
        <div class="layout-stack layout-stretch">
          <div class="auth-context-copy">
            <h1 data-copy="sideTitle"></h1>
            <p data-copy="sideText"></p>
          </div>
        </div>
      </div>

      <div class="auth-form-side layout-form layout-center">
        <div class="layout-stack">
          <div class="auth-card reveal">
            <div id="entryRoot"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/apps/entry/entry.js"></script>
</body>
</html>
